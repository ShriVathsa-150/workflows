
name: Security Scan

on: [push, pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tools
        run: pip install bandit pip-audit

      - name: Bandit Scan
        run: bandit -r .

      - name: Dependency Scan
        run: pip-audit
